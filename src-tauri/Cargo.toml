[package]
name = "position-zero"
version = "0.1.0"
description = "POSITION ZERO — local chess pattern laboratory"
authors = ["zincara"]
edition = "2021"

[lib]
name = "position_zero_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-sql = { version = "2.3.1", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSOperation", "NSString", "block2"] }

[dev-dependencies]
pretty_assertions = "1"
